<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carousel Sequencer</title>
<!-- Local tool: photos are decoded and measured on this device; nothing is uploaded. -->
<style>
  /* Neutral greys with no hue bias on purpose: the chrome must not tint how photos read.
     Colour is reserved for state (kept, flagged) and the camera lane. */
  :root {
    --bg: #e8e8e8; --panel: #f4f4f4; --raise: #ffffff; --line: #cdcdcd; --well: #d6d6d6;
    --text: #181818; --muted: #525252; --faint: #7c7c7c;
    --flag: #8a4f00; --keep: #1f7a45; --on: #181818; --onText: #ffffff;
    --cam1: #5f7d9c; --cam2: #a8793f; --cam3: #4f8a62; --cam4: #8f5f95; --cam5: #7a7a7a;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1b1b; --panel: #232323; --raise: #2b2b2b; --line: #393939; --well: #141414;
      --text: #e6e6e6; --muted: #a0a0a0; --faint: #707070;
      --flag: #e8a948; --keep: #62c98b; --on: #e6e6e6; --onText: #111111;
      --cam1: #87a6c6; --cam2: #d0a067; --cam3: #7fbf93; --cam4: #bf8fc5; --cam5: #9a9a9a;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1b1b; --panel: #232323; --raise: #2b2b2b; --line: #393939; --well: #141414;
    --text: #e6e6e6; --muted: #a0a0a0; --faint: #707070;
    --flag: #e8a948; --keep: #62c98b; --on: #e6e6e6; --onText: #111111;
    --cam1: #87a6c6; --cam2: #d0a067; --cam3: #7fbf93; --cam4: #bf8fc5; --cam5: #9a9a9a;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 var(--sans); -webkit-text-size-adjust: 100%; }
  body { padding-bottom: env(safe-area-inset-bottom, 0px); }
  button, select, input { font: inherit; color: inherit; }
  button { -webkit-tap-highlight-color: transparent; background: var(--raise); border: 1px solid var(--line); border-radius: 8px;
    padding: 7px 12px; min-height: 38px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:disabled { opacity: .4; cursor: default; }
  button.primary, button[aria-pressed="true"] { background: var(--on); color: var(--onText); border-color: var(--on); }
  button.ghost { background: transparent; }
  button.small { min-height: 30px; padding: 3px 9px; font-size: 13px; }
  :focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  input[type=text] { background: var(--raise); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-width: 0; }
  select { background: var(--raise); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; min-height: 38px; }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); } .faint { color: var(--faint); } .flag { color: var(--flag); }
  .wrap { padding-inline: 16px; }
  .filebtn { position: relative; overflow: hidden; display: inline-flex; }
  .filebtn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; font-size: 100px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

  /* ---------- header + tabs ---------- */
  header { padding-block: 12px 8px; display: flex; flex-direction: column; gap: 8px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand b { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 650; }
  .brand .spacer { flex: 1; }
  #titleIn { font-size: 22px; font-weight: 650; border: 0; border-bottom: 1px dashed var(--line); border-radius: 0; background: transparent; padding: 4px 0; width: 100%; }
  #titleIn::placeholder { color: var(--faint); font-weight: 500; }
  #counts { font-size: 13px; }
  nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
  nav .tabs { display: flex; gap: 4px; padding-block: 6px; }
  nav .tabs button { flex: 1; border-radius: 999px; border-color: transparent; background: transparent; font-weight: 600; }
  nav .tabs button[aria-selected="true"] { background: var(--on); color: var(--onText); }
  nav .tabs small { font-weight: 500; opacity: .75; margin-left: 4px; }
  .notice { margin-top: 10px; padding: 10px 12px; border: 1px dashed var(--line); border-radius: 8px; color: var(--muted); }
  .notice.warn { border-style: solid; border-color: var(--flag); color: var(--text); }
  .notice b { color: var(--text); }

  /* ---------- cut ---------- */
  .toolbar { display: flex; flex-direction: column; gap: 10px; padding-block: 12px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--raise); }
  .seg button { border: 0; border-radius: 0; min-height: 34px; padding: 4px 12px; background: transparent; }
  .seg button[aria-pressed="true"] { background: var(--on); color: var(--onText); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 13px; background: var(--raise); min-height: 30px; }
  .chip i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; padding-bottom: 24px; }
  .card { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; cursor: pointer; text-align: left; padding: 0; min-height: 0; display: block; width: 100%; }
  .card .ph { position: relative; aspect-ratio: 1; background: var(--well); }
  .card .ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .card .cap { padding: 5px 7px 6px; display: flex; flex-direction: column; gap: 1px; }
  .card .fn { font: 600 14px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .fl { font-size: 12px; color: var(--flag); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 16px; }
  .card.out { opacity: .42; }
  .card.kept { border-color: var(--keep); box-shadow: inset 0 0 0 1px var(--keep); }
  .badge { position: absolute; font: 600 11px/18px var(--sans); padding: 0 6px; border-radius: 9px; background: rgba(0,0,0,.72); color: #fff; }
  .badge.tl { left: 5px; top: 5px; } .badge.tr { right: 5px; top: 5px; } .badge.bl { left: 5px; bottom: 5px; } .badge.br { right: 5px; bottom: 5px; }
  .badge.keep { background: var(--keep); color: #fff; }
  .camdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }
  .empty { padding: 40px 0; color: var(--muted); text-align: center; }

  /* ---------- loupe ---------- */
  #loupe { position: fixed; inset: 0; z-index: 60; background: #0e0e0e; color: #eee; display: flex; flex-direction: column;
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
  #loupe button { background: #262626; border-color: #3a3a3a; color: #eee; }
  #loupe button.primary, #loupe button[aria-pressed="true"] { background: #eee; color: #111; border-color: #eee; }
  #loupe button.keepBtn[aria-pressed="true"] { background: #3fae6c; border-color: #3fae6c; color: #fff; }
  .lTop { display: flex; align-items: center; gap: 10px; padding: 8px 12px; }
  .lTop .fn { font: 600 17px var(--mono); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lImg { flex: 1 1 auto; min-height: 0; position: relative; touch-action: pan-y; }
  .lImg img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; user-select: none; -webkit-user-drag: none; }
  .lNav { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 64px; opacity: .8; }
  .lNav.prev { left: 6px; } .lNav.next { right: 6px; }
  .lPanel { padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 9px; max-height: 46vh; overflow: auto; background: #151515; border-top: 1px solid #2a2a2a; }
  .lActs { display: grid; grid-template-columns: 1fr 1fr 1.4fr; gap: 8px; }
  .lActs button { min-height: 46px; font-weight: 650; }
  .lInfo { font-size: 14px; color: #bbb; display: flex; flex-direction: column; gap: 4px; }
  .lInfo .flag { color: #f0b04a; }
  .tagrow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .tagrow > span { color: #999; font-size: 13px; width: 52px; }
  .tagrow button { min-height: 32px; padding: 3px 10px; font-size: 14px; }
  .rel { display: flex; gap: 6px; overflow-x: auto; align-items: center; }
  .rel > span { color: #999; font-size: 13px; flex: 0 0 auto; max-width: 110px; }
  .rel button { padding: 0; width: 64px; min-height: 0; height: 64px; flex: 0 0 auto; overflow: hidden; position: relative; }
  .rel button img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .rel button em { position: absolute; left: 0; right: 0; bottom: 0; font: 10px var(--mono); font-style: normal; background: rgba(0,0,0,.7); }
  details.nums summary { cursor: pointer; color: #999; font-size: 13px; }
  details.nums table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 6px; }
  details.nums td, details.nums th { padding: 3px 4px; text-align: right; border-bottom: 1px solid #2a2a2a; font-weight: normal; }
  details.nums td:first-child, details.nums th:first-child { text-align: left; }
  details.nums th { color: #888; }

  /* ---------- sequence ---------- */
  .lanes { display: flex; gap: 3px; overflow-x: auto; padding-block: 12px 4px; }
  .lane { flex: 0 0 44px; display: flex; flex-direction: column; gap: 3px; cursor: pointer; }
  .lane .t { height: 44px; background: var(--well); border-radius: 4px; overflow: hidden; position: relative; }
  .lane .t img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .lane .t span { position: absolute; left: 3px; top: 1px; font: 10px var(--mono); color: #fff; text-shadow: 0 0 3px #000; }
  .lane .cam { height: 6px; border-radius: 3px; }
  .lane .lum { height: 22px; background: var(--panel); border-radius: 3px; position: relative; overflow: hidden; }
  .lane .lum i { position: absolute; left: 0; right: 0; bottom: 0; background: var(--muted); }
  .lane .col { height: 10px; border-radius: 3px; border: 1px solid var(--line); }
  .laneKey { font-size: 12px; color: var(--faint); display: flex; gap: 12px; flex-wrap: wrap; padding-bottom: 8px; }
  #warnList { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  #warnList li { color: var(--flag); font-size: 14px; } #warnList li.info { color: var(--muted); }
  #warnList li::before { content: '• '; }
  #slots { display: flex; flex-direction: column; margin-top: 12px; }
  .slotRow { display: grid; grid-template-columns: 30px 88px minmax(0, 1fr); gap: 10px; align-items: start; padding: 10px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; }
  .slotRow.dragging { opacity: .6; }
  .slotRow.dropBefore { box-shadow: 0 -3px 0 var(--text); }
  .slotRow .idx { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .slotRow .idx b { font: 700 18px var(--mono); }
  .handle { cursor: grab; touch-action: none; padding: 6px 4px; color: var(--faint); font-size: 18px; line-height: 1; user-select: none; }
  .slotRow .th { width: 88px; height: 88px; background: var(--well); border-radius: 6px; overflow: hidden; position: relative; }
  .slotRow .th img { width: 100%; height: 100%; object-fit: contain; }
  .slotRow .th .vid { position: absolute; inset: 0; display: grid; place-items: center; font-size: 12px; color: var(--muted); text-align: center; padding: 6px; }
  .slotRow .body { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .slotRow .role { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .slotRow .role em { text-transform: none; letter-spacing: 0; font-style: normal; color: var(--faint); }
  .slotRow .fn { font: 600 16px var(--mono); }
  .slotRow .fl { font-size: 13px; color: var(--flag); }
  .slotRow .acts { display: flex; gap: 6px; flex-wrap: wrap; }
  .pick { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
  .pick > span { font-size: 12px; color: var(--faint); width: 44px; }
  .pick button { min-height: 28px; padding: 2px 9px; font-size: 13px; border-radius: 999px; }
  .seamRow { font-size: 12px; color: var(--faint); padding: 5px 0 5px 40px; min-height: 12px; }
  .seamRow .on { color: var(--flag); }
  .addRow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; padding-bottom: 32px; }

  /* ---------- sheet ---------- */
  #sheet { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.5); display: flex; align-items: flex-end; justify-content: center; }
  #sheet .box { background: var(--bg); width: min(720px, 100%); max-height: 86vh; border-radius: 14px 14px 0 0; display: flex; flex-direction: column;
    padding-bottom: env(safe-area-inset-bottom, 0px); }
  #sheet .hd { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  #sheet .hd b { flex: 1; }
  #sheet .list { overflow: auto; padding: 10px 16px 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .cand .hints { font-size: 12px; color: var(--keep); } .cand .hints.flag { color: var(--flag); }

  /* ---------- preview ---------- */
  .pvWrap { display: flex; flex-wrap: wrap; gap: 24px; padding-block: 14px 32px; justify-content: center; }
  .phone { flex: 0 0 auto; border: 1px solid #333; border-radius: 34px; padding: 36px 12px 20px; background: #000; color: #fff; }
  .phone.bare { border: 0; border-radius: 10px; padding: 10px 0; }
  .postHead { display: flex; align-items: center; gap: 8px; padding: 0 4px 8px; font-weight: 600; font-size: 14px; }
  .postHead i { width: 26px; height: 26px; border-radius: 50%; background: #444; display: inline-block; }
  .car { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .car::-webkit-scrollbar { display: none; }
  .slide { position: relative; flex: 0 0 auto; overflow: hidden; scroll-snap-align: start; background: #111; }
  .car.cropping .slide { cursor: move; touch-action: none; }
  .slide img, .gcell img { position: absolute; max-width: none; user-select: none; -webkit-user-drag: none; pointer-events: none; }
  .slide .vid { position: absolute; inset: 0; display: grid; place-items: center; color: #aaa; text-align: center; padding: 20px; }
  .gridBox { position: absolute; border: 1px dashed rgba(255,255,255,.9); box-shadow: 0 0 0 999px rgba(0,0,0,.35); pointer-events: none; }
  .dots { display: flex; justify-content: center; gap: 4px; padding: 10px 0 4px; flex-wrap: wrap; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: #555; } .dots i.on { background: #ddd; }
  .pvNav { display: flex; justify-content: space-between; align-items: center; padding: 4px 4px 0; color: #aaa; }
  .pvNav button { background: #222; border-color: #444; color: #eee; }
  .side { flex: 0 1 380px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .gridMock .g { display: grid; gap: 2px; background: #000; padding: 2px; border-radius: 4px; width: max-content; max-width: 100%; }
  .gcell { position: relative; overflow: hidden; background: #2a2a2a; }
  #exportLog { font: 12px var(--mono); color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
  label.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--on); color: var(--onText);
    padding: 9px 14px; border-radius: 8px; z-index: 90; max-width: calc(100vw - 32px); font-size: 14px; }
  @media (max-width: 520px) {
    #grid, #sheet .list { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
    .card .cap { padding: 4px 5px 5px; } .card .fn { font-size: 12px; } .card .sub, .card .fl { font-size: 11px; }
    .slotRow { grid-template-columns: 26px 72px minmax(0, 1fr); gap: 8px; padding: 8px; }
    .slotRow .th { width: 72px; height: 72px; }
  }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
</style>
</head>
<body>
<header class="wrap">
  <div class="brand"><b>Carousel Sequencer</b><span class="spacer"></span>
    <button class="small ghost" id="saveSeqBtn">Save backup</button>
    <button class="small ghost" id="newBtn">New carousel</button></div>
  <input id="titleIn" type="text" placeholder="Carousel title or thesis" aria-label="Carousel title or thesis" autocomplete="off">
  <div id="counts" class="muted"></div>
</header>
<nav class="wrap" aria-label="Steps">
  <div class="tabs" role="tablist">
    <button role="tab" id="tabCut" data-tab="cut">Cut<small id="nCut"></small></button>
    <button role="tab" id="tabSeq" data-tab="seq">Sequence<small id="nSeq"></small></button>
    <button role="tab" id="tabPv" data-tab="pv">Preview</button>
  </div>
</nav>
<div class="wrap"><div id="notices"></div></div>

<section id="cutView" class="wrap">
  <div class="toolbar">
    <div class="row">
      <label class="filebtn"><button type="button" class="primary" tabindex="-1">Add from Photos</button>
        <input id="photosIn" type="file" multiple accept="image/*" aria-label="Add from Photos"></label>
      <label class="filebtn"><button type="button" tabindex="-1">Add from Files</button>
        <input id="filesIn" type="file" multiple aria-label="Add from Files"></label>
      <label class="filebtn" id="folderLabel" hidden><button type="button" tabindex="-1">Add folder</button>
        <input id="folderIn" type="file" webkitdirectory multiple aria-label="Add a folder"></label>
      <span id="measureNote" class="faint"></span>
    </div>
    <div class="row">
      <div class="seg" id="filterSeg" role="group" aria-label="Show">
        <button data-f="todo">To decide</button><button data-f="keep">Kept</button><button data-f="out">Out</button><button data-f="all">All</button>
      </div>
      <button id="stackBtn" class="small" aria-pressed="true">Stack twins</button>
    </div>
    <div class="chips" id="camChips"></div>
  </div>
  <div id="grid"></div>
  <div id="gridEmpty" class="empty" hidden></div>
</section>

<section id="seqView" class="wrap" hidden>
  <div class="lanes" id="lanes"></div>
  <div class="laneKey" id="laneKey"></div>
  <ul id="warnList"></ul>
  <div id="slots"></div>
  <div class="addRow">
    <button id="addPhotoSlot" class="primary">+ Photo</button>
    <button id="addVideoSlot">+ Video slide</button>
    <span id="slotCount" class="faint" style="align-self:center"></span>
  </div>
</section>

<section id="pvView" class="wrap" hidden>
  <div class="row" style="padding-top:12px">
    <label class="field">Carousel ratio
      <select id="aspectSel">
        <option value="4:5">4:5 · 1080×1350</option><option value="1:1">1:1 · 1080×1080</option>
        <option value="3:4">3:4 · 1080×1440</option><option value="1.91:1">1.91:1 · 1080×566</option>
      </select></label>
    <label class="field">Profile grid
      <select id="gridSel"><option value="3:4">3:4</option><option value="1:1">1:1</option></select></label>
    <button id="cropBtn" aria-pressed="false" style="align-self:flex-end">Adjust crop</button>
    <label class="field" id="zoomLabel" hidden>Zoom<input id="zoomIn" type="range" min="1" max="3" step="0.01" value="1"></label>
    <button id="resetCropBtn" hidden style="align-self:flex-end">Reset crop</button>
  </div>
  <div class="pvWrap">
    <div class="phone" id="phone">
      <div class="postHead"><i></i><span id="pvTitle">you</span></div>
      <div class="car" id="car"></div>
      <div class="dots" id="dots"></div>
      <div class="pvNav"><button id="prevBtn" aria-label="Previous slide">‹</button><span id="pvCount" class="num"></span><button id="nextBtn" aria-label="Next slide">›</button></div>
    </div>
    <div class="side">
      <div class="gridMock"><div class="g" id="gridMockG"></div></div>
      <p class="muted" style="margin:0">Slide 1 at the profile-grid crop (centred), also shown by the dashed box. Swipe to page through. <b>Adjust crop</b> lets you drag each slide's framing.</p>
      <label class="field">Capture times in exported files
        <select id="dateSel">
          <option value="now">sequential from now (keeps order in Photos)</option>
          <option value="none">none: no metadata at all</option>
        </select></label>
      <div class="row"><button id="exportBtn" class="primary">Export JPEGs</button></div>
      <div class="row" id="saveRow"></div>
      <div id="exportLog"></div>
    </div>
  </div>
</section>

<div id="loupe" hidden role="dialog" aria-modal="true" aria-label="Photo">
  <div class="lTop"><button id="lClose" aria-label="Close">✕</button><span class="fn" id="lName"></span><span id="lPos" class="num" style="color:#999"></span></div>
  <div class="lImg" id="lImg"><img id="lPic" alt=""><button class="lNav prev" id="lPrev" aria-label="Previous">‹</button><button class="lNav next" id="lNext" aria-label="Next">›</button></div>
  <div class="lPanel">
    <div class="lActs"><button id="lOut">Out</button><button id="lKeep" class="keepBtn">Keep</button><button id="lAdd">Add to carousel</button></div>
    <div class="lInfo" id="lInfo"></div>
    <div class="tagrow" id="lScale"></div>
    <div class="tagrow" id="lYou"></div>
    <div class="rel" id="lTwins"></div>

        var poster = await idb('blobs', 'readonly', function (st) { return st.get('poster:' + s.id); });

  /* ---------- frames ---------- */

    var added = 0, relinked = 0, skipped = 0, fresh = [], jsons = [];
    for (var i = 0; i < files.length; i++) {
      var file = files[i];

      if (file.name[0] === '.' || !(IMG_RE.test(file.name) || CS.isRaw(file.name) || /^image\//.test(file.type))) { skipped++; continue; }

  function importBackup(p) {
    if (!p || !p.frames) return;

  /* ----- Cut ----- */
  var cards = new Map();
  function visibleInCut(f) {
    if (S.cam != null && f.device.key !== S.cam) return false;

    if (S.filter === 'out') return f.status === 'out';
    return true;
  }

    if (!S.stack) return list;
    var shown = {}, out = [];
    list.forEach(function (f) {
      var g = D.twins.groupOf[f.id];
      if (!g) { out.push(f); return; }
      if (shown[g]) return;
      shown[g] = true;
      if (!forLoupe) { out.push(f); return; }
      list.forEach(function (x) { if (D.twins.groupOf[x.id] === g) out.push(x); });
    });

  }
  function renderCut() {
    document.querySelectorAll('#filterSeg button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.f === S.filter)); });
    $('#stackBtn').setAttribute('aria-pressed', String(S.stack));
    $('#folderLabel').hidden = isIOS || inFrame || !('webkitdirectory' in document.createElement('input'));
    // camera chips
    var chips = $('#camChips'); chips.textContent = '';
    if (D.camOrder.length > 1) {
      chips.appendChild(h('button', { class: 'chip', 'aria-pressed': String(S.cam == null), text: 'All cameras',
        onclick: function () { S.cam = null; render(); } }));
      D.camOrder.forEach(function (k) {
        var fs = S.frames.filter(function (f) { return f.device.key === k; });
        var b = h('button', { class: 'chip', 'aria-pressed': String(S.cam === k), onclick: function () { S.cam = S.cam === k ? null : k; render(); } },
          h('i', { style: 'background:' + camColor(fs[0]) }), camLabel(fs[0]) + ' · ' + fs.length);
        chips.appendChild(b);

      updateCard(c, f);
      if (grid.children[i] !== c.el) grid.insertBefore(c.el, grid.children[i] || null);
    });
    while (grid.children.length > list.length) grid.removeChild(grid.lastChild);
    var empty = $('#gridEmpty');
    empty.hidden = list.length > 0;
    if (!list.length) empty.textContent = !S.frames.length ? 'Add photos from your library or files. Load the whole pool; you will cut it down here.'
      : S.filter === 'todo' ? 'Nothing left to decide' + (S.cam != null ? ' for this camera' : '') + '.' : 'Nothing here.';
  }
  function makeCard(f) {
    var img = h('img', { alt: '', loading: 'lazy', decoding: 'async' });
    var el = h('button', { class: 'card', type: 'button' }, h('div', { class: 'ph' }, img));
    var cap = h('div', { class: 'cap' });
    var fn = h('div', { class: 'fn' }), sub = h('div', { class: 'sub' }), fl = h('div', { class: 'fl' });
    cap.appendChild(fn); cap.appendChild(sub); cap.appendChild(fl);

    var words = flagWords(f), rh = D.rhymes[f.id];
    var sig = [f.thumbUrl, f.status, slide, nTw, words.join(), rh ? rh.length : 0, f.measure, S.stack].join('|');
    if (c.sig === sig) return;
    c.sig = sig;
    if (f.thumbUrl && c.img.src !== f.thumbUrl) c.img.src = f.thumbUrl;
    c.el.classList.toggle('out', f.status === 'out');
    c.el.classList.toggle('kept', f.status === 'keep');

    c.fn.title = f.name;
    c.sub.textContent = '';
    c.sub.appendChild(h('span', { class: 'camdot', style: 'background:' + camColor(f) }));
    c.sub.appendChild(document.createTextNode(camLabel(f) + (f.raw ? ' · RAW' : '')));
    c.fl.textContent = f.measure === 'error' ? 'could not open' : f.measure !== 'done' ? (f.measure === 'needs file' ? 'add again to measure' : '…') : words.join(' · ');

    if (slide != null) c.ph.appendChild(h('span', { class: 'badge tr', text: '#' + (slide + 1) }));
    if (S.stack && nTw > 1) c.ph.appendChild(h('span', { class: 'badge bl', text: '×' + nTw + ' twins' }));
    else if (nTw > 1) c.ph.appendChild(h('span', { class: 'badge bl', text: 'twin' }));
    if (rh) c.ph.appendChild(h('span', { class: 'badge br', title: 'same layout of light and dark as a frame from another camera', text: 'rhyme' }));

  /* ----- Loupe (full-screen culling) ----- */
  var L = { id: null, list: [], order: [] };

        h('img', { src: g.thumbUrl || '', alt: g.name }), h('em', { text: g.num + (g.status === 'keep' ? ' ✓' : g.status === 'out' ? ' ✕' : '') })));

      var f = s.f, r = slideRect(f), sc = pv.W / r.w, freeX = f.width - r.w, freeY = f.height - r.h;
      if (freeX > 0.5) f.crop.x = clamp01(start.cx - (e.clientX - start.x) / sc / freeX);
      if (freeY > 0.5) f.crop.y = clamp01(start.cy - (e.clientY - start.y) / sc / freeY);
      placeSlide(s); if (s === pv.slides[0]) placeGridCell();
    });
    function end() { if (start) { start = null; dirty(); } }
    s.box.addEventListener('pointerup', end); s.box.addEventListener('pointercancel', end);
  }
  function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
  function syncIdx() {
    var i = Math.round($('#car').scrollLeft / pv.W);
    pv.idx = Math.max(0, Math.min(pv.slides.length - 1, i));
    $('#pvCount').textContent = pv.slides.length ? (pv.idx + 1) + ' / ' + pv.slides.length : 'no slides';
    Array.prototype.forEach.call($('#dots').children, function (d, j) { d.className = j === pv.idx ? 'on' : ''; });
    var s = pv.slides[pv.idx];
    if (s && !s.video) $('#zoomIn').value = s.f.crop.zoom;
  }
  $('#car').addEventListener('scroll', syncIdx);
  function go(d) { $('#car').scrollTo({ left: Math.max(0, pv.idx + d) * pv.W, behavior: 'smooth' }); }
  $('#prevBtn').onclick = function () { go(-1); };
  $('#nextBtn').onclick = function () { go(1); };
  $('#zoomIn').oninput = function () {
    var s = pv.slides[pv.idx]; if (!s || s.video) return;
    s.f.crop.zoom = Math.max(1, +this.value); placeSlide(s); if (pv.idx === 0) placeGridCell(); dirty();
  };
  $('#resetCropBtn').onclick = function () {
    var s = pv.slides[pv.idx]; if (!s || s.video) return;
    s.f.crop = { x: 0.5, y: 0.5, zoom: 1 }; placeSlide(s); if (pv.idx === 0) placeGridCell(); syncIdx(); dirty();
  };
  $('#aspectSel').onchange = function () { S.aspect = this.value; buildPreview(); dirty(); };
  $('#gridSel').onchange = function () { S.gridAspect = this.value; buildGridMock(); if (pv.slides[0] && !pv.slides[0].video) placeSlide(pv.slides[0]); dirty(); };

  /* ----- Export ----- */
  async function deliver(files) {
    var dl = await dlP;
    if (dl) {
      for (var i = 0; i < files.length; i++) {
        try { await dl.save({ filename: files[i].name, data: files[i].blob }); }
        catch (e) {
          if (e && e.code === 'rate_limited') { i--; await new Promise(function (r) { setTimeout(r, 1200); }); continue; }
          if (e && e.code === 'declined') { toast('Stopped at ' + files[i].name); return false; }
          toast('Could not save ' + files[i].name); return false;
        }
      }
      return true;
    }
    try {
      var sf = files.map(function (f) { return new File([f.blob], f.name, { type: f.blob.type }); });
      if (navigator.canShare && navigator.canShare({ files: sf })) { await navigator.share({ files: sf }); return true; }
    } catch (e) { if (e && e.name === 'AbortError') return false; }
    for (var j = 0; j < files.length; j++) {
      var a = h('a', { href: URL.createObjectURL(files[j].blob), download: files[j].name });
      document.body.appendChild(a); a.click(); a.remove();
      if (files.length > 1) await new Promise(function (r) { setTimeout(r, 200); });
    }
    return true;
  }
  $('#exportBtn').onclick = function () { exportSlides(false); };
  async function exportSlides(fromCopies) {
    var btn = $('#exportBtn'), log = $('#exportLog'), row = $('#saveRow');
    var size = CS.ASPECTS[S.aspect], A = size.w / size.h, mode = $('#dateSel').value;
    var missing = S.slides.filter(function (s) { return s.kind === 'photo' && !S.byId.get(s.id).file; }).map(function (s) { return S.byId.get(s.id).num; });
    row.textContent = '';
    if (missing.length && !fromCopies) {
      log.textContent = 'The originals of ' + missing.join(', ') + ' are not loaded in this session. Add them again (Add from Photos or Files) for full quality, or export from the stored 1440 px copies.\n';
      row.appendChild(h('button', { text: 'Export from stored copies', onclick: function () { exportSlides(true); } }));
      return;
    }
    var base = mode === 'now' ? Date.now() - new Date().getTimezoneOffset() * 60000 : null;
    btn.disabled = true;
    log.textContent = 'Rendering at ' + size.w + '×' + size.h + '…\n';
    var out = [];
    try {
      for (var i = 0; i < S.slides.length; i++) {
        var sl = S.slides[i], nn = (i < 9 ? '0' : '') + (i + 1);
        if (sl.kind === 'video') { log.textContent += nn + '  video: add "' + sl.label + '" in Instagram at slide ' + (i + 1) + '\n'; continue; }
        var f = S.byId.get(sl.id);
        var blobIn = f.file ? (await CS.decodableBlob(f.file)).blob : await fetchBlob(f.previewUrl);
        var bmp = await createImageBitmap(blobIn, { imageOrientation: 'from-image' });
        var r = CS.cropRect(bmp.width, bmp.height, A, f.crop);
        var cv = document.createElement('canvas'); cv.width = size.w; cv.height = size.h;
        var ctx = cv.getContext('2d'); ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(bmp, r.x, r.y, r.w, r.h, 0, 0, size.w, size.h);
        if (bmp.close) bmp.close();
        var blob = await new Promise(function (res) { cv.toBlob(res, 'image/jpeg', 0.92); });
        cv.width = cv.height = 1;
        var bytes = new Uint8Array(await blob.arrayBuffer());
        if (base != null) bytes = CS.insertApp1(bytes, CS.buildDateApp1(base + i * 1000));
        var name = nn + '-' + f.num.replace(/[^\w-]+/g, '_') + '.jpg';
        out.push({ name: name, blob: new Blob([bytes], { type: 'image/jpeg' }) });
        log.textContent += name + (f.file ? '' : '  (from stored copy)') + '\n';
      }
      log.textContent += (base != null ? 'Only capture times written, 1 s apart, so Photos keeps this order.' : 'No metadata in the files.') + '\n';
      row.appendChild(h('button', { class: 'primary', text: 'Save all ' + out.length, onclick: async function () {
        if (await deliver(out)) log.textContent += 'Handed ' + out.length + ' files to the save sheet.\n';
      } }));
      out.forEach(function (o) { row.appendChild(h('button', { class: 'small', text: o.name.slice(0, 2), title: 'Save ' + o.name, onclick: function () { deliver([o]); } })); });
    } catch (err) {
      log.textContent += 'Export stopped: ' + (err && err.message || err) + '\n';
    } finally { btn.disabled = false; }
  }
  function fetchBlob(url) {
    return new Promise(function (res, rej) {
      var img = new Image();
      img.onload = function () { var c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight; c.getContext('2d').drawImage(img, 0, 0); c.toBlob(res, 'image/png'); };
      img.onerror = rej; img.src = url;
    });
  }

  /* ---------- wiring ---------- */
  function setTab(t) { S.tab = t; render(); if (t === 'pv') buildPreview(); window.scrollTo(0, 0); }
  document.querySelectorAll('nav .tabs button').forEach(function (b) { b.onclick = function () { setTab(b.dataset.tab); }; });
  document.querySelectorAll('#filterSeg button').forEach(function (b) { b.onclick = function () { S.filter = b.dataset.f; render(); }; });
  $('#stackBtn').onclick = function () { S.stack = !S.stack; cards.forEach(function (c) { c.sig = ''; }); render(); };
  $('#titleIn').addEventListener('input', function () { S.title = this.value; dirty(); });
  $('#photosIn').onchange = function (e) { var fs = e.target.files; addFiles(fs).then(function () { e.target.value = ''; }); };
  $('#filesIn').onchange = function (e) { var fs = e.target.files; addFiles(fs).then(function () { e.target.value = ''; }); };
  $('#folderIn').onchange = function (e) {
    var fs = Array.prototype.slice.call(e.target.files).filter(function (f) { return (f.webkitRelativePath || f.name).split('/').length <= 2; });
    addFiles(fs).then(function () { e.target.value = ''; });
  };
  var newArmed = 0;
  $('#newBtn').onclick = function () {
    if (!S.frames.length) return;
    if (Date.now() - newArmed > 4000) { newArmed = Date.now(); $('#newBtn').textContent = 'Tap again to clear'; setTimeout(function () { $('#newBtn').textContent = 'New carousel'; }, 4000); return; }
    newArmed = 0; $('#newBtn').textContent = 'New carousel';
    clearAll(false); setTab('cut');
  };
  $('#saveSeqBtn').onclick = function () {
    var name = (S.title || 'carousel').replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-').toLowerCase() || 'carousel';
    deliver([{ name: name + '.json', blob: new Blob([JSON.stringify(projectJSON(), null, 2)], { type: 'application/json' }) }]);
  };
  document.addEventListener('keydown', function (e) {
    var tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'select' || tag === 'textarea' || e.metaKey || e.ctrlKey) return;
    if (!$('#loupe').hidden) {
      var k = e.key.toLowerCase();
      if (e.key === 'ArrowLeft') loupeStep(-1); else if (e.key === 'ArrowRight') loupeStep(1);
      else if (e.key === 'Escape') closeLoupe();
      else if (k === 'p' || k === 'k') setStatus('keep');
      else if (k === 'x') setStatus('out');
      else if (k === 'u') { var f = S.byId.get(L.id); if (f) { f.status = null; changed(); } }
      else if (k === 'a') $('#lAdd').click();
      else return;
      e.preventDefault();
    } else if (!$('#sheet').hidden && e.key === 'Escape') closeSheet();
    else if (S.tab === 'pv' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) go(e.key === 'ArrowLeft' ? -1 : 1);
  });

  /* ---------- example pool (generated, so the page opens in a working state) ---------- */
  async function exampleFiles() {
    var cams = {
      main: { make: 'FUJIFILM', model: 'X-T5', name: function (n) { return 'IMG_' + (9760 + n) + '.JPG'; }, warm: 0.30 },
      digi: { make: 'Canon', model: 'Canon PowerShot SD1000', name: function (n) { return '103_' + String(210 + n).padStart(4, '0') + '.JPG'; }, warm: 0.12, lift: 18 },
      phone: { make: 'Apple', model: 'iPhone 15 Pro', name: function (n) { return 'IMG_' + (4400 + n) + '.JPG'; }, warm: 0.42 }
    };
    var plan = [
      ['main', 1, 3], ['main', 2, 3, { bright: 14 }], ['digi', 1, 5], ['main', 3, 8], ['phone', 1, 11], ['main', 4, 13, { cast: [11, -9, 12] }],
      ['digi', 2, 3], ['main', 5, 17], ['digi', 3, 19, { sky: 0.3 }], ['phone', 2, 23], ['main', 6, 29], ['digi', 4, 31], ['main', 7, 37, { blur: 3 }],
      ['phone', 3, 41], ['digi', 5, 43], ['main', 8, 47], ['digi', 6, 53], ['main', 9, 59], ['phone', 4, 61], ['main', 10, 67], ['digi', 7, 71], ['main', 11, 73]
    ];
    var files = [];
    for (var i = 0; i < plan.length; i++) {
      var cam = cams[plan[i][0]], r = plan[i][3] || {}, seed = plan[i][2] * 9301;
      var rnd = function () { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
      var c = document.createElement('canvas'); c.width = 1200; c.height = 900;
      var g = c.getContext('2d');
      var sky = g.createLinearGradient(0, 0, 0, 900);
      sky.addColorStop(0, 'rgb(150,166,178)'); sky.addColorStop(1, 'rgb(96,92,84)');
      g.fillStyle = sky; g.fillRect(0, 0, 1200, 900);
      for (var k = 0; k < 24; k++) {
        var v = 45 + rnd() * 160 + (cam.lift || 0), s = rnd() * cam.warm;
        g.fillStyle = 'rgb(' + Math.round(v * (1 + s)) + ',' + Math.round(v) + ',' + Math.round(v * (1 - s)) + ')';
        g.fillRect(rnd() * 1200, 180 + rnd() * 720, 60 + rnd() * 380, 40 + rnd() * 260);
      }
      if (r.sky) { g.fillStyle = '#fff'; g.fillRect(0, 0, 1200, 900 * r.sky); }
      if (r.blur) { g.filter = 'blur(' + r.blur + 'px)'; g.drawImage(c, 0, 0); g.filter = 'none'; }
      if (r.bright || r.cast) {
        var d = g.getImageData(0, 0, 1200, 900), px = d.data, add = r.cast || [r.bright, r.bright, r.bright];
        for (var p = 0; p < px.length; p += 4) { px[p] += add[0]; px[p + 1] += add[1]; px[p + 2] += add[2]; }
        g.putImageData(d, 0, 0);
      }
      var blob = await new Promise(function (res) { c.toBlob(res, 'image/jpeg', 0.86); });
      var bytes = CS.insertApp1(new Uint8Array(await blob.arrayBuffer()), CS.buildExifApp1({ make: cam.make, model: cam.model, date: Date.UTC(2026, 7, 1 + i, 12) }));
      files.push(new File([bytes], cam.name(plan[i][1]), { type: 'image/jpeg' }));
    }
    return files;
  }
  async function boot() {
    if (await restoreProject()) { changed(); S.measured = S.frames.filter(function (f) { return f.metrics; }).length; render(); return; }
    try {
      var files = await exampleFiles();
      S.example = true;
      await addFiles(files, { example: true });
      render();
    } catch (e) { render(); }
  }
  boot();

  window.__cs = { state: S, derived: D, render: render };  // for tests / console poking
})();
