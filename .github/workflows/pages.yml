# Publishes the Toolbelt (launcher + modules) to GitHub Pages as a static site.
# One-time setup in the repo: make it public (Pages is free for public repos), then
# Settings → Pages → Source: "GitHub Actions". Private alternative: Cloudflare Pages, free,
# build command `node tools/stamp-sw.mjs`, output directory `/`.
name: pages
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    # GitHub Pages is free only for public repositories: skip (don't fail) while this one is private
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/stamp-sw.mjs
      - run: mkdir -p site && cp -r index.html manifest.webmanifest sw.js icons modules site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deployment
        uses: actions/deploy-pages@v4
