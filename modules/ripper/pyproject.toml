[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toolbelt-ripper"
version = "0.1.0"
description = "Local audio/video capture with provenance: yt-dlp + ffmpeg, highest-fidelity stream selection, mastering-grade quality report."
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = ["yt-dlp==2026.8.19", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ripper = "ripper.cli:main"

[tool.setuptools.packages.find]
include = ["ripper*"]

[tool.setuptools.package-data]
ripper = ["ui.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
